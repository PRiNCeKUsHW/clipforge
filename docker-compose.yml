# ClipForge local development stack.
#   docker compose up --build
# Frontend: http://localhost:3000   API docs: http://localhost:8000/docs   Storage browser: http://localhost:8888

x-python-env: &python-env
  env_file: .env
  # Come back automatically after a crash (e.g. out of memory); unfinished tasks are re-queued.
  restart: unless-stopped
  environment:
    # Windows bind mounts don't deliver file-change events into Linux containers,
    # so the auto-reloaders poll instead.
    WATCHFILES_FORCE_POLLING: "true"
    PYTHONUNBUFFERED: "1"

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipforge}
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipforge} -d ${POSTGRES_DB:-clipforge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (SeaweedFS). Same S3 API as Cloudflare R2 in production.
  # (MinIO no longer publishes community Docker images.)
  s3:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.54
    command: mini -dir=/data
    environment:
      # Admin credentials for the S3 API, and the bucket to create on startup
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-clipforge}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-clipforge-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-clipforge}
    ports:
      - "9000:8333"   # S3 API (browser uses http://localhost:9000 for presigned URLs)
      - "8888:8888"   # file browser UI
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    <<: *python-env
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  # General pipeline stages (download, highlights) + plain ffmpeg cuts ("render" queue in Phase 1).
  worker:
    <<: *python-env
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        INSTALL_WHISPERX: ${INSTALL_WHISPERX:-false}
    command: >
      watchfiles --filter python
      "celery -A clipforge_worker.celery_app worker -Q default,render -c 2 -n default@%h --loglevel=INFO"
      /app/clipforge_worker /app/app
    volumes:
      - ./worker/clipforge_worker:/app/clipforge_worker
      - ./backend/app:/app/app:ro
      - workdata:/data/work
      - whisper-models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # Local transcription. Concurrency 1: one Whisper model in memory at a time.
  worker-transcribe:
    <<: *python-env
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        INSTALL_WHISPERX: ${INSTALL_WHISPERX:-false}
    command: >
      watchfiles --filter python
      "celery -A clipforge_worker.celery_app worker -Q transcribe -c 1 -n transcribe@%h --loglevel=INFO"
      /app/clipforge_worker /app/app
    volumes:
      - ./worker/clipforge_worker:/app/clipforge_worker
      - ./backend/app:/app/app:ro
      - workdata:/data/work
      # Whisper / alignment / diarization models are cached here, so rebuilds don't re-download them
      - whisper-models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # Remotion render service: composes the final 1080x1920 clip (crop path + animated captions).
  # Reads clip segments from / writes renders to the shared work volume; no storage credentials.
  renderer:
    build:
      context: ./renderer
    env_file: .env
    restart: unless-stopped
    volumes:
      - workdata:/data/work
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>r.json()).then(j=>process.exit(j.ready?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    restart: unless-stopped
    environment:
      # Windows bind mounts don't deliver file-change events; poll for hot reload
      NEXT_WATCH_POLL_MS: "1000"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # keep the container's own node_modules / .next (not the Windows ones)
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  s3data:
  workdata:
  whisper-models:
